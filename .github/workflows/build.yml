
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Underground-Geode
          path: build/**/*.geode
